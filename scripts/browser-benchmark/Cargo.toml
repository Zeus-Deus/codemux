[package]
name = "codemux-browser-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "browser-benchmark"
path = "main.rs"

[dependencies]
axum = "0.7"
dirs = "6"
futures-util = "0.3"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
which = "6"

[profile.dev]
debug = 0
