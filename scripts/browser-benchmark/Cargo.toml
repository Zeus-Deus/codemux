[package]
name = "codemux-browser-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "browser-benchmark"
path = "main.rs"

[dependencies]
axum = "0.7"
dirs = "6"
futures-util = "0.3"
hmac = "0.12"
libc = "0.2"
rand = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
sysinfo = "0.33"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }
which = "6"

[profile.dev]
debug = 0
