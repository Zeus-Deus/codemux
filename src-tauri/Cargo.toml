[package]
name = "codemux"
default-run = "codemux"
version = "0.17.1"
description = "The Agentic Development Environment for Builders"
authors = ["Zeus-Deus"]
license = "Elastic-2.0"
repository = "https://github.com/Zeus-Deus/codemux"
homepage = "https://codemux.org"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The `test` feature exposes `tauri::test::MockRuntime` in normal (non-dev)
# builds. `codemux serve` hosts the full command surface on MockRuntime to run
# headless (no display server) — see src/web_remote/serve.rs. The feature is
# additive: the GUI path never instantiates the mock runtime.
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
toml = "1.0.3"
dirs = "6.0.0"
portable-pty = "0.8.1"
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
notify-rust = "4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
base64 = "0.22"
tempfile = "3"
tokio-tungstenite = "0.26"
futures-util = "0.3"
libc = "0.2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Persistent native-side logging (file in the app log dir + stderr).
# Without an installed logger every `log::error!` from dependencies —
# notably rfd's "Failed to pick folder" when no dialog backend exists
# (issue #95) — vanished silently. `codemux logs` tails the file.
tauri-plugin-log = "2"
log = "0.4"
# WebKit2GTK strips clipboard image payloads from the standard
# `paste` event for security reasons, so reading clipboard images
# from JS via `e.clipboardData` always comes back empty on Linux.
# The clipboard-manager plugin reads the OS clipboard from the Rust
# side and hands the bytes to the frontend, bypassing the webview
# filter. Used by the new-workspace dialog's paste-to-attach flow.
tauri-plugin-clipboard-manager = "2"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hostname = "0.4"
url = "2"
urlencoding = "2"
regex = "1.12.3"
which = "6"
async-trait = "0.1"
futures-core = "0.3"
serde_yaml = "0.9"
glob = "0.3"
ignore = "0.4"
nucleo-matcher = "0.3"
# PNG encoder for the clipboard-paste flow. The OS clipboard hands
# us raw RGBA pixels via tauri-plugin-clipboard-manager; we encode
# to a real PNG on the Rust side so the resulting attachment file
# is a valid image (not just RGBA bytes with a .png extension) and
# so the encoded bytes never have to cross the JS IPC boundary.
png = "0.17"
# Cross-platform process + system metrics for the resource monitor.
# Powers per-terminal CPU/memory aggregation in resource_metrics.rs.
sysinfo = "0.33"
# RFC 5545 recurrence-rule engine for the Automations feature. Parses
# an iCalendar DTSTART+RRULE block and computes the next occurrence
# with IANA-timezone / DST correctness. Used by automations::recurrence.
rrule = "0.14"
# Axum HTTP server for the new `codemux-remote serve` headless control
# endpoint. Loopback-only by default (127.0.0.1), bearer-token auth via
# a manifest file. The transport choice (HTTP+bearer over loopback,
# tunnelled via SSH when remote) is the v1 design constraint that lets
# us drop in an optional cloud relay later without changing the daemon.
# See docs/plans/mcp-on-remote.md.
#
# The `ws` feature is required by the embedded web-remote-access server
# (`src/web_remote/`), which upgrades `/ws` connections to drive the same
# frontend bundle from a browser on another device. It pulls in
# tokio-tungstenite + sha1 + base64 (all already in the tree).
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
# HTTP response compression for the web-remote server's JSON APIs and embedded
# frontend bundle (`CompressionLayer`, gzip only — images and other
# already-compressed types are excluded by tower-http's default predicate).
# Negotiated per request: a client that sends no `Accept-Encoding` still gets
# identical identity bytes.
tower-http = { version = "0.6", features = ["compression-gzip"] }
# Raw-deflate codec behind the web-remote WebSocket's application-level
# compression (`src/web_remote/compress.rs`). tungstenite has no
# permessage-deflate, so the server frames its own compressed messages with one
# shared deflate stream per connection. Already in the dependency tree.
flate2 = "1"
# Streaming body for the authenticated `/api/assets` route: `ReaderStream`
# wraps a `tokio::fs::File` so large files (images referenced from the web
# client) are piped chunk-by-chunk instead of buffered whole into memory.
# The `io` feature adds no new transitive crates (bytes/futures-core are
# already in the tree).
tokio-util = { version = "0.7", features = ["io"] }
# Local network-interface enumeration for the web-remote endpoint list
# (loopback + LAN IPs). Thin wrapper over `getifaddrs`/`GetAdaptersAddresses`;
# `libc` (already a dependency) backs it on Unix. Tailnet IPs + MagicDNS are
# discovered separately by shelling out to `tailscale status --json`.
if-addrs = "0.13"
# Pure-Rust QR encoder for `codemux remote pair`, which prints a scannable
# terminal QR of the pairing URL so a phone can pair over SSH without the
# desktop GUI. `default-features = false` drops the optional image/svg/pic
# renderers — we only use the built-in unicode (`Dense1x2`) renderer, so this
# adds no image-processing crates to the tree.
qrcode = { version = "0.14", default-features = false }
# Pure-Rust QUIC endpoint for the web-remote "from-anywhere" transport tier.
# The desktop becomes an iroh endpoint (default-off, gated by
# `web_remote.config.relay_mode_enabled`) so a browser can reach a NAT'd desktop
# over an E2E-encrypted QUIC stream via hole-punching (relay-of-last-resort
# forwards ciphertext only — the operator never sees plaintext). The existing
# `/ws` frame contract rides *inside* an iroh bi-stream unchanged; iroh only
# swaps the transport. Shares the app's tokio runtime — no second runtime is
# spawned. See `src/web_remote/iroh.rs` and
# `docs/plans/web-remote-account-mode.md` (Design 1 §1.2, Stage C).
iroh = "1"
# No-echo password prompt for `codemux login`. The CLI has to read a
# password from a bare SSH session with no GUI, so it needs to flip the
# terminal's ECHO flag off (termios on unix, console mode on Windows).
# rpassword is the small, widely-used crate for exactly that and pulls in
# nothing beyond libc / windows-sys, both already in the tree.
rpassword = "7"

[target.'cfg(unix)'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Used by dialog_preflight.rs to ask the XDG desktop portal whether a
# FileChooser backend actually exists before opening a file dialog.
# The dialog plugin above is portal-only, and on minimal window-manager
# setups (i3, dwm, ...) no portal backend may be running — the dialog
# then silently resolves as if cancelled (issue #95). zbus is already
# in the tree via rfd -> ashpd, so this adds no new build cost.
zbus = "5"
# Direct handle on the WebKitGTK settings object behind each webview
# (`webview_tuning.rs`), reached through Tauri's `with_webview` escape
# hatch. Pinned to the exact version + feature set wry already depends on
# so Cargo unifies them into one crate — `PlatformWebview::inner()` hands
# back a `webkit2gtk::WebView` from *that* build, and a mismatch would not
# type-check.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = { version = "2" }
# Used only by os_input.rs Tier-3 input injection — EnumWindows,
# QueryFullProcessImageNameW, SetCursorPos, SendInput. Already in the
# transitive tree; the explicit dep just lets us call the functions.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Gates the fake_* test helper [[bin]] targets below. Off by default
# so plain `cargo build --release` never produces them and tauri-cli
# excludes them from bundles (it skips [[bin]] entries whose
# required-features are disabled — see get_binaries in tauri-cli's
# interface/rust.rs). Through v0.9.1 the fixtures shipped in the
# deb/rpm/AppImage at usr/bin because every ungated [[bin]] of the
# app package gets bundled.
test-fixtures = []

[dev-dependencies]
mockito = "1"
serial_test = "3"
# Enable tauri's `test` feature so integration tests can build a
# mock app handle via `tauri::test::mock_app`. Feature unification
# means this flag activates at every build, but the `test` feature
# is additive and doesn't change runtime behavior.
tauri = { version = "2", features = ["test"] }
# Self-referential dev-dependency: activates `test-fixtures` whenever
# dev targets build (i.e. `cargo test`), so the fake_* helper bins are
# compiled and `env!("CARGO_BIN_EXE_fake_*")` in the integration tests
# resolves — while normal/release builds keep the feature off and the
# fixtures out of shipped bundles. Cyclic dev-dependencies are
# explicitly supported by Cargo.
codemux = { path = ".", features = ["test-fixtures"] }

[target.'cfg(unix)'.dev-dependencies]
# Used by auth/api.rs tests to dup2 stderr for the log-leak
# regression guard. Unix-only because the underlying capture mechanism
# relies on POSIX fd dup2. On Windows the equivalent guarantee is
# provided statically by the typed AuthSecret boundary + Debug-redact
# test.
gag = "1"

# Test helper binary used by `tests/json_rpc_child.rs` — simulates a JSON-RPC
# peer over stdio. Gated behind `test-fixtures` (auto-enabled for
# `cargo test` via the self dev-dependency) so release builds skip it
# and tauri-cli keeps it out of the deb/rpm/AppImage bundles.
[[bin]]
name = "fake_rpc_child"
path = "tests/helpers/fake_rpc_child/main.rs"
test = false
doctest = false
bench = false
required-features = ["test-fixtures"]

# Test helper binary used by `tests/codex_adapter.rs` — simulates the
# `codex app-server` JSON-RPC peer. Gated like fake_rpc_child above.
[[bin]]
name = "fake_codex_app_server"
path = "tests/helpers/fake_codex_app_server/main.rs"
test = false
doctest = false
bench = false
required-features = ["test-fixtures"]

# Test helper binary used by `tests/claude_adapter.rs` — simulates the
# claude-agent sidecar without involving the real SDK. Gated like
# fake_rpc_child above.
[[bin]]
name = "fake_claude_sidecar"
path = "tests/helpers/fake_claude_sidecar/main.rs"
test = false
doctest = false
bench = false
required-features = ["test-fixtures"]

# `codemux-remote` — the slim server-side binary that runs on the
# remote host the laptop pushes workspaces to. Same Rust crate
# (`codemux_lib`), but a UI-free entry point: no Tauri, no webkit,
# no frontend dependencies. Step 2c of the cloud-push series.
#
# Cross-compile targets (set up in the release CI, not in this file):
#   x86_64-unknown-linux-gnu        (most servers + home labs)
#   aarch64-unknown-linux-gnu       (Raspberry Pi, AWS Graviton)
#   x86_64-apple-darwin             (older Intel Macs)
#   aarch64-apple-darwin            (Apple Silicon Macs)
#
# The laptop's codemux bundles the four binaries as resources and
# scp's the matching one to the remote at bootstrap time.
[[bin]]
name = "codemux-remote"
path = "src/bin/codemux_remote.rs"
test = false
doctest = false
bench = false
