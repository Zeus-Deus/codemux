[package]
name = "codemux"
default-run = "codemux"
version = "0.1.26"
description = "The Agentic Development Environment for Builders"
authors = ["Zeus-Deus"]
license = "Elastic-2.0"
repository = "https://github.com/Zeus-Deus/codemux"
homepage = "https://codemux.org"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codemux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
toml = "1.0.3"
dirs = "6.0.0"
portable-pty = { git = "https://github.com/Zeus-Deus/portable-pty", branch = "codemux-0.8.1-no-window" }
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
notify-rust = "4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
tempfile = "3"
tokio-tungstenite = "0.26"
futures-util = "0.3"
libc = "0.2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
sha2 = "0.10"
hostname = "0.4"
url = "2"
urlencoding = "2"
regex = "1.12.3"
which = "6"
async-trait = "0.1"
futures-core = "0.3"

[target.'cfg(unix)'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-dialog = { version = "2" }

[dev-dependencies]
mockito = "1"
serial_test = "3"
# Enable tauri's `test` feature so integration tests can build a
# mock app handle via `tauri::test::mock_app`. Feature unification
# means this flag activates at every build, but the `test` feature
# is additive and doesn't change runtime behavior.
tauri = { version = "2", features = ["test"] }

# Test helper binary used by `tests/json_rpc_child.rs` — simulates a JSON-RPC
# peer over stdio. Compiled with the crate; not shipped in distributions
# because tests do not run against release builds.
[[bin]]
name = "fake_rpc_child"
path = "tests/helpers/fake_rpc_child/main.rs"
test = false
doctest = false
bench = false

# Test helper binary used by `tests/codex_adapter.rs` — simulates the
# `codex app-server` JSON-RPC peer.
[[bin]]
name = "fake_codex_app_server"
path = "tests/helpers/fake_codex_app_server/main.rs"
test = false
doctest = false
bench = false

# Test helper binary used by `tests/claude_adapter.rs` — simulates the
# claude-agent sidecar without involving the real SDK.
[[bin]]
name = "fake_claude_sidecar"
path = "tests/helpers/fake_claude_sidecar/main.rs"
test = false
doctest = false
bench = false
