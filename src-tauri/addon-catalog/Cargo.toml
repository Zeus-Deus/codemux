[package]
name = "codemux-addon-catalog"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
codemux-addon-protocol = { path = "../addon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
url = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
